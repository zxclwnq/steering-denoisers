version: 1
status: frozen_before_collection_and_training
experiment_id: flow_scaling_2x2_v1
experiment_class: concept_independent_capacity_data_scaling

# Preregistered protocol for the cheap-scaling experiment. This file is frozen
# before any FineWeb activation is collected and before any arm is trained. Its
# SHA256 is pinned in interp.scaling.APPROVED_SCALING_PROTOCOL_SHA256.
#
# Mechanical identities that cannot exist yet (activation-artifact hashes, run
# directories, checkpoint hashes) live in configs/flow_scaling_2x2_artifacts_v1.yaml
# and are verified against on-disk validation reports at evaluation time. They are
# recorded provenance, not preregistered claims.

question: >-
  Is the negative Phase-B result of the 16.5M FineWeb-free flow prior limited by
  unique activation-data coverage, by insufficient paper-style width, or by both?

design:
  kind: 2x2
  factors:
    capacity: [narrow16m, wide60m]
    unique_data: [fw4m, fw32m]
  estimands:
    - capacity main effect
    - unique-data main effect
    - capacity x unique-data interaction
  method_change: capacity_only
  method_change_note: >-
    Architecture family, flow objective, time convention, standardization, and
    sampler are identical in every arm. Only internal width and the number of
    unique activation tokens vary.

capacity_bound:
  max_parameters: 60407808
  forbidden:
    - 6/12/24-block GLP scaling
    - models above 100M parameters
    - attention-based activation priors
    - ensembles
  inference_requirement: must remain usable at NFE 1

arms:
  - id: narrow16m_fw4m
    training_config: configs/flow_train_scaling_narrow16m_fw4m_v1.yaml
    flow_core_config: configs/flow_core_v1.yaml
    parameters: 16147200
    dataset: resid7_fw_train_4000k_v1
    unique_activation_tokens: 4000119
  - id: narrow16m_fw32m
    training_config: configs/flow_train_scaling_narrow16m_fw32m_v1.yaml
    flow_core_config: configs/flow_core_v1.yaml
    parameters: 16147200
    dataset: resid7_fw_train_32000k_v1
    unique_activation_tokens: 32000063
  - id: wide60m_fw4m
    training_config: configs/flow_train_scaling_wide60m_fw4m_v1.yaml
    flow_core_config: configs/flow_core_wide_60m_v1.yaml
    parameters: 60407808
    dataset: resid7_fw_train_4000k_v1
    unique_activation_tokens: 4000119
  - id: wide60m_fw32m
    training_config: configs/flow_train_scaling_wide60m_fw32m_v1.yaml
    flow_core_config: configs/flow_core_wide_60m_v1.yaml
    parameters: 60407808
    dataset: resid7_fw_train_32000k_v1
    unique_activation_tokens: 32000063

compute_matching:
  matched_quantity: total_activation_presentations
  total_activation_presentations: 102400000
  optimizer_steps: 100000
  batch_size: 1024
  schedule_horizon: 100000
  rationale: >-
    Every arm sees the same number of activation presentations, takes the same
    number of optimizer steps, and follows the same cosine horizon, so the number
    of dataset passes is the only data-side difference and width is the only
    model-side difference. Wall-clock compute is not matched because the wide
    model costs about 3.7x per step; matching wall-clock instead would confound
    capacity with training length.
  dataset_passes:
    fw4m: 26.95
    fw32m: 3.37
  historical_comparability: >-
    clean_flow_100k_v1 used the same recipe on 4M OpenWebText activations, so the
    narrow16m_fw4m arm differs from it only by corpus. That run is retained as a
    corpus reference and is not a cell of this 2x2.

validation:
  artifact: resid7_fw_val_1024k_v1
  corpus: fineweb
  split: val
  document_range: [0, 40000]
  disjoint_from_training_documents: true
  per_seq: 127
  val_fraction: 0.05
  split_seed: 20260807
  split_fingerprint: 5725541eaecf437c
  fixed_across_arms: true
  flow_loss:
    seed: 20260814
    batch_size: 1024
    t_bins: [0.0, 0.10, 0.25, 0.50, 0.75, 1.0]
    rows: internal_validation_split_only

phase_a:
  n_sequences: 256
  sequence_selection: first_sorted_internal_validation_sequences
  internal_split: validation_only
  ctx: 128
  hook: blocks.7.hook_resid_pre
  skip_bos: true
  lm_batch_size: 8
  noise_seed: 0
  matched_epsilon_across_arms: true
  identity_nfe: 1
  t_start: [0.10, 0.25, 0.50]
  nfe: [1, 3, 5]
  primary_t_start: 0.50
  primary_nfe: 1
  bootstrap_seed: 20260813
  bootstrap_resamples: 10000
  bootstrap_confidence: 0.95
  extended_nfe_recheck: [10, 20]
  extended_nfe_recheck_status: optional_diagnostic_only_after_selection

selection_rule:
  frozen_before_results: true
  primary: mean_reconstructed_delta_lm_at_primary_cell
  primary_unit: validation_sequence
  primary_direction: lower_is_better
  resolution: >-
    An arm beats another only if the paired bootstrap CI of the per-sequence
    difference in reconstructed delta LM at the primary cell excludes zero.
    Otherwise the two arms are tied.
  tie_breakers:
    - lower validation flow MSE on resid7_fw_val_1024k_v1
    - fewer parameters
    - fewer unique activation tokens
  forbidden_inputs:
    - steering metrics
    - Phase-B results
    - DEV directions
    - held-out directions
    - LLM judges
  post_selection_note: >-
    Diagnostic cells (other t_start/NFE settings and the optional NFE 10/20
    recheck) cannot select an arm or redefine the rule.

protected_data:
  dev_directions: forbidden
  held_out: forbidden
  steering_vectors: forbidden
  phase_b: forbidden
  llm_judges: forbidden

stop_condition:
  full_2x2_requires_human_approval: true
  prerequisites:
    - fineweb collection smoke passed
    - wide-model smoke passed
    - end-to-end smoke passed
    - targeted tests pass
