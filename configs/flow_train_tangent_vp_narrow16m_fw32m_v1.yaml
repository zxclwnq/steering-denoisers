version: 1
experiment_id: flow_train_tangent_vp_narrow16m_fw32m_v1
experiment_class: post_stop_method_development

# Post-stop experiment A of docs/POST_STOP_PROTOCOL_2026-08-19.md, added on
# 2026-08-19 after the branch stop rule had already fired. It is post-hoc and not
# preregistered. It does not reopen
# docs/BRANCH_CLOSURE_CONSTRAINT_PRESERVING_TANGENT_FLOW.md: the T1/T2 outcome of
# 2026-08-16 stands unchanged, and nothing trained here may be reported as part
# of it.
#
# Trained on an RTX 3090, torch 2.6.0+cu124, after a full test run on the same
# machine. Only the `status` field changed when the run was authorized; `status`
# lives in `raw` and is excluded from the config fingerprint, so the scientific
# fingerprint is unchanged.
status: authorized

flow_core_config: configs/flow_core_conditional_narrow16m_v1.yaml

experiment_card:
  hypothesis: >-
    The constraint-preserving path used by the closed branch,
    x_t = c v + (1 - t) x_perp + t eps_perp, holds the semantic coordinate but
    shrinks the orthogonal scale to (1 - t)^2 + t^2 -- a factor of two at
    t = 0.5. Its training states are therefore off the natural activation shell
    in norm as well as in direction. The quarter-circle path
    x_t = c v + cos(theta) x_perp + sin(theta) eps_perp, theta = (pi/2) t,
    holds the same coordinate exactly and preserves the orthogonal scale. This
    config trains the prior; whether it naturalizes a hard clamp better than the
    linear-path prior, or better than the clamp itself, is tested separately
    (A-T2) and is not assumed here.
  independent_variable: >-
    corruption path within the constraint hyperplane (quarter circle instead of
    chord). Nothing else differs from flow_train_tangent_narrow16m_fw32m_v1.
  controlled_variables:
    - corpus, tokenizer, model revision, hook, and context length
    - architecture family, width, block count, time embedding, condition encoder
    - standardization and the exact raw -> standardized hyperplane transform
    - optimizer, learning rate, weight decay, warmup, schedule horizon, batch size, dtype, grad clip
    - training-only direction pool and its provenance digest
    - >-
      noise_seed 20260816, deliberately IDENTICAL to the linear tangent run. The
      variance-preserving sampler consumes its generator in exactly the same
      order (pool direction, then t, then eps), so the same seed yields the same
      directions, the same t and the same eps. This is a genuinely paired
      corruption stream and is asserted by
      tests/test_vp_tangent_flow.py::test_the_two_samplers_consume_identical_randomness.
  uncontrolled_variables:
    - >-
      GPU and driver, if this run executes on a different worker than the 2026-08-16
      linear tangent run. Training is deterministic given the seeds and dtype, but
      float reduction order is not bitwise identical across devices.
  baseline: >-
    flow_train_tangent_narrow16m_fw32m_v1 (linear tangent path, 16M, FW32M,
    checkpoint best_step_249000.pt). Unlike the closed branch, this IS a matched
    objective-only control: same capacity, same budget, same data, same paired
    corruption stream, one formula changed. Comparisons must nonetheless be made
    at MATCHED SEVERITY, t_vp = (2/pi) arctan(t_lin / (1 - t_lin)), never at
    equal t.
  metrics:
    - val_flow_mse (variance-preserving objective; the selection metric)
    - val_flow_mse_by_bin
    - zero_predictor_mse
    - val_cosine_velocity
    - val_raw_parallel_velocity_mean (diagnostic only, never a selection signal)
  # Recorded before any number exists, so it cannot be claimed afterwards:
  cross_objective_metric_warning: >-
    val_flow_mse is NOT comparable between this run and the linear tangent run.
    The two velocity targets have different scales (u*_vp carries a pi/2 factor
    and does not decay with t the way the chord's constant velocity does). Only
    functional quantities -- recovered fraction and paired dNLL through GPT-2 --
    may be compared across the two objectives.
  expected_failure_mode: >-
    the variance-preserving objective is no easier to learn than the chord and
    the model does not solve its own matched reconstruction task (A-T1 FAIL ->
    stop, do not run A-T2)
  success_criterion: >-
    complete finite run with checkpoints selected only by val_flow_mse; the A-T1
    gate is evaluated afterwards and is not part of this config

data:
  dataset: resid7_fw_train_32000k_v1
  split: train
  repository: HuggingFaceFW/fineweb
  repository_config: sample-10BT
  repository_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  tokenizer: gpt2
  per_seq: 127
  val_fraction: 0.05
  split_seed: 20260807
  split_fingerprint: 02dad171587ee40f
  bos_dropped: true
  steering_vectors_used: false

normalization:
  statistics_from: train_split_only
  eps: 1.0e-5
  accumulation_dtype: float64

training:
  seed: 0
  noise_seed: 20260816
  steps: 250000
  batch_size: 1024
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  schedule: cosine
  warmup_steps: 500
  grad_clip: 1.0
  dtype: float32
  eval_every: 500

conditioning:
  direction_pool: data/direction_pools/training_only_rank256_v1.pt
  direction_pool_split: training_only
  steering_vector_conditioning: false
  coordinate: linear_projection
  condition_source: natural_coordinate

flow_objective:
  # theta = (pi/2) t
  # x_t = c v + cos(theta) (x0 - c v) + sin(theta) (eps - <eps, v> v)
  # u*  = (pi/2) ( cos(theta) eps_perp - sin(theta) x0_perp )
  type: tangent_variance_preserving
  # Unchanged from the linear tangent run: the velocity used for the loss, for
  # Euler integration and for reconstruction is analytically projected into
  # v-perp, so the constraint is exact rather than learned.
  output_projection: true

compute_budget:
  unique_activation_tokens: 32000063
  unique_training_tokens: 30400117
  total_activation_presentations: 256000000
  approximate_dataset_passes: 8.42
  optimizer_steps: 250000
  expected_runtime_minutes: [35, 45]

validation:
  seed: 0
  batches: 20
  t_bins: [0.0, 0.10, 0.25, 0.50, 0.75, 1.0]
  selection_metric: val_flow_mse
  selection_mode: min
  in_run_note: >-
    Checkpoint selection is concept-independent: variance-preserving tangent flow
    MSE on this artifact's own held-back 5% document split, with directions drawn
    only from the training-only pool. No DEV or held-out steering vector, and no
    steering performance of any kind, may influence checkpoint selection.

checkpoints:
  save_steps: [25000, 75000, 125000, 175000, 250000]
  keep: [best, last, configured_steps]
  include_optimizer_state: true

protected_data:
  held_out: forbidden
  dev: forbidden
