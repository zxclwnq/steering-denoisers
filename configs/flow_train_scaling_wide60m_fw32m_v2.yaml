version: 1
experiment_id: flow_scaling_wide60m_fw32m_v2
experiment_class: concept_independent_capacity_data_scaling
status: authorized
flow_core_config: configs/flow_core_wide_60m_v1.yaml

experiment_card:
  hypothesis: >-
    The negative Phase-B result may be limited by unique activation-data coverage
    and/or insufficient paper-style width. This arm is the high-capacity,
    high-unique-data corner of a 2x2 that separates the capacity effect, the
    unique-data effect, and their interaction under concept-independent metrics.
  independent_variable: none within the arm; the 2x2 varies model width and unique activation tokens
  controlled_variables:
    - corpus, tokenizer, model revision, hook, and context length
    - flow path, velocity target, standardization, and sampler
    - optimizer, learning rate, weight decay, warmup, schedule horizon, batch size, dtype, grad clip
    - training and noise seeds
    - total activation presentations (256,000,000)
    - frozen FineWeb validation artifact used for cross-arm comparison
  baseline: >-
    the historical 16M/OpenWebText-4M run clean_flow_100k_v1, retained as a
    corpus reference only and not as a cell of this 2x2. Note that it used a
    100k-step budget, so it is no longer budget-matched to this arm
  metrics:
    - val_flow_mse
    - val_flow_mse_by_bin
    - zero_predictor_mse
    - val_cosine_velocity
    - Phase-A functional reconstruction on the frozen validation artifact
  expected_failure_mode: no arm improves concept-independent reconstruction over the others
  success_criterion: complete finite run with checkpoints selected only by val_flow_mse

data:
  dataset: resid7_fw_train_32000k_v1
  split: train
  repository: HuggingFaceFW/fineweb
  repository_config: sample-10BT
  repository_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
  tokenizer: gpt2
  per_seq: 127
  val_fraction: 0.05
  split_seed: 20260807
  split_fingerprint: 02dad171587ee40f
  bos_dropped: true
  steering_vectors_used: false

normalization:
  statistics_from: train_split_only
  eps: 1.0e-5
  accumulation_dtype: float64

# Budget change from the v1 protocol: 250,000 steps instead of 100,000, decided
# by the human before any v2 arm was trained and applied identically to all four
# arms. Everything else is the frozen clean_flow_100k_v1 recipe; the cosine
# horizon necessarily follows the new step count.
# Identical to the frozen clean_flow_100k_v1 recipe otherwise. The first controlled
# capacity/data comparison deliberately does not also move toward the reference
# GLP optimizer settings (lr 5e-5, batch 4096, bf16, single pass); doing so would
# confound capacity, unique data, and optimization in one experiment.
training:
  seed: 0
  noise_seed: 20260812
  steps: 250000
  batch_size: 1024
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  schedule: cosine
  warmup_steps: 500
  grad_clip: 1.0
  dtype: float32
  eval_every: 500

compute_budget:
  unique_activation_tokens: 32000063
  unique_training_tokens: 30400117
  total_activation_presentations: 256000000
  approximate_dataset_passes: 8.42
  optimizer_steps: 250000
  expected_runtime_minutes: [85, 120]

validation:
  seed: 0
  batches: 20
  t_bins: [0.0, 0.10, 0.25, 0.50, 0.75, 1.0]
  selection_metric: val_flow_mse
  selection_mode: min
  in_run_note: >-
    In-run validation uses this artifact's own held-back 5% document split and is
    only used for checkpoint selection inside the arm. All cross-arm comparisons
    use the frozen resid7_fw_val_1024k_v1 artifact through the scaling evaluator.

checkpoints:
  save_steps: [25000, 75000, 125000, 175000, 250000]
  keep: [best, last, configured_steps]
  include_optimizer_state: true

protected_data:
  held_out: forbidden
