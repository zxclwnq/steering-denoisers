  # {0.10, 0.25, 0.50} lies where this model ignores the condition.
  t_start: [0.50, 0.75, 0.90]
  nfe: [1, 3, 5]
  off_distribution_norm: 600.0
  guard_fallback: additive

condition_use_evidence:
  source: results/condition_use_v1/best_step_249500.json
  spec_version: condition_use_v1
  relative_swap_sensitivity_target:
    t_0.50: 0.02648
    t_0.75: 0.07670
    t_0.90: 0.21948
    t_1.00: 0.15712

baselines:
  reuse_existing: true
  additive: results/phase_b_wide60m_v1/baselines/additive.rescored.meta.json
  shrinkage_k080: results/phase_b_wide60m_v1/baselines/shrinkage_k080.rescored.meta.json
  unconditional_flow: results/phase_b_wide60m_v1/flow
  note: >-
    Only the nine conditional arms consume new compute. Regenerating the
    baselines would break comparability with frozen Phase B.

controls:
  matched_realised_projection: required
  vs_additive: required
  vs_shrinkage_k080: required
  vs_unconditional_flow_at_t050: required

