  val_flow_mse: 0.8269649088382721
  direction_pool_split: training_only
  direction_pool_excluded: [dev, held_out]

flow:
  kind: conditional_coordinate_request
  integrator: reverse_explicit_euler
  seed_mode: clean
  coordinate_mode: additive
